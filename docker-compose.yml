
services:
  postgres:
    image: postgres:17-alpine
    container_name: flashcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashcart_db}
      POSTGRES_USER: ${POSTGRES_USER:-flashcart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashcart_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashcart_user} -d ${POSTGRES_DB:-flashcart_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
